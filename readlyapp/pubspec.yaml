name: readly
description: ReadLy - aplikasi assistive reading untuk pengguna low vision, disleksia, dan kesulitan membaca (prototype offline).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  # Offline:
  flutter_tts: ^4.2.0
  google_mlkit_text_recognition: ^0.15.0
  pdfx: ^2.9.0
  # Word / PowerPoint (Premium) dan riwayat:
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
